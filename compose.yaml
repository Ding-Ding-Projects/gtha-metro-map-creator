# Run the published image. Override the tag or host port with GMMC_TAG and GMMC_PORT.
name: gtha-metro-map-creator
services:
  web:
    image: ghcr.io/ding-ding-projects/gtha-metro-map-creator:${GMMC_TAG:-latest}
    ports:
      - "${GMMC_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
