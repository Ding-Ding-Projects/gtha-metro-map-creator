name: Appliance check

# Builds and boot-tests the appliance disk images from main, using the container image that the
# "Container image" workflow publishes for this exact commit (tag sha-<short sha>). Nothing is
# released; the images are kept as workflow artifacts. The release workflow runs the same build
# for v* tags.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'appliance/**'
      - 'Dockerfile'
      - '.github/workflows/image.yml'
      - '.github/workflows/appliance-check.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: appliance-check-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ding-ding-projects/gtha-metro-map-creator

jobs:
  appliance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils rsync e2fsprogs dosfstools mtools fdisk zip xz-utils curl
      - name: Allow KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: the boot test will use software emulation (slower)."
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the container image of this commit
        id: img
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          version="$(node -p "require('./desktop/package.json').version")"
          ref="$IMAGE:sha-$short"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then break; fi
            echo "Waiting for $ref (attempt $i of 60)"; sleep 30
          done
          docker pull "$ref"
          docker tag "$ref" "$IMAGE:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Appliance sign-in logic tests (real loop devices, fake docker)
        run: |
          set -euo pipefail
          hash1="$(echo 'test-password-one' | docker run --rm -i "$IMAGE:${{ steps.img.outputs.version }}" gmmc-auth hash)"
          hash2="$(echo 'test-password-two' | docker run --rm -i "$IMAGE:${{ steps.img.outputs.version }}" gmmc-auth hash)"
          iso="$RUNNER_TEMP/config-disk.iso"
          echo "$hash1" > "$RUNNER_TEMP/hash1"
          node desktop/deploy/lib/config-disk.js "$RUNNER_TEMP/hash1" "$iso"
          sudo env "PATH=$PATH" bash appliance/test-signin.sh "$hash1" "$iso"
          sudo env "PATH=$PATH" GMMC_TEST_DISPOSABLE=1 sh appliance/test-service.sh "$hash1" "$hash2"
      - name: Build the appliance images
        run: sudo appliance/build.sh "${{ steps.img.outputs.version }}" "$IMAGE:${{ steps.img.outputs.version }}" "$PWD/appliance-out"
      - name: Boot test
        run: |
          sudo chown -R "$USER" appliance-out
          appliance/boot-test.sh "appliance-out/gtha-metro-map-creator-appliance-${{ steps.img.outputs.version }}-x86_64.qcow2" "${{ steps.img.outputs.version }}" 600
      - name: Boot test with a FAT configuration disk (password sign-in)
        run: appliance/boot-test.sh "appliance-out/gtha-metro-map-creator-appliance-${{ steps.img.outputs.version }}-x86_64.qcow2" "${{ steps.img.outputs.version }}" 600 --config-disk vfat --image "$IMAGE:${{ steps.img.outputs.version }}"
      - name: Boot test with the ISO configuration disk the deploy app makes
        run: appliance/boot-test.sh "appliance-out/gtha-metro-map-creator-appliance-${{ steps.img.outputs.version }}-x86_64.qcow2" "${{ steps.img.outputs.version }}" 600 --config-disk iso --image "$IMAGE:${{ steps.img.outputs.version }}"
      - name: Boot test with an invalid password setting (the app must refuse to start)
        run: appliance/boot-test.sh "appliance-out/gtha-metro-map-creator-appliance-${{ steps.img.outputs.version }}-x86_64.qcow2" "${{ steps.img.outputs.version }}" 600 --config-disk invalid
      - name: Boot test as a USB stick (the raw .img the deploy app writes, on a blank 4 GiB virtual stick, then with a second GMMCCONF password stick)
        run: |
          stick="$RUNNER_TEMP/virtual-usb-stick.img"
          xz -dc "appliance-out/gtha-metro-map-creator-appliance-${{ steps.img.outputs.version }}-x86_64.img.xz" > "$stick"
          truncate -s 4G "$stick"
          appliance/boot-test.sh "$stick" "${{ steps.img.outputs.version }}" 900 --usb
          appliance/boot-test.sh "$stick" "${{ steps.img.outputs.version }}" 900 --usb --config-disk vfat --image "$IMAGE:${{ steps.img.outputs.version }}"
          rm -f "$stick"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appliance-check
          path: |
            appliance-out/*.qcow2.xz
            appliance-out/*.log
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore

  appliance-rpi:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils mtools dosfstools xz-utils curl
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the container image of this commit
        id: img
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          version="$(node -p "require('./desktop/package.json').version")"
          ref="$IMAGE:sha-$short"
          for i in $(seq 1 60); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then break; fi
            echo "Waiting for $ref (attempt $i of 60)"; sleep 30
          done
          docker pull --platform linux/arm64 "$ref"
          docker tag "$ref" "$IMAGE:$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the Raspberry Pi image
        run: appliance/build-rpi.sh "${{ steps.img.outputs.version }}" "$IMAGE:${{ steps.img.outputs.version }}" "$PWD/appliance-rpi-out"
      - name: Make the build outputs readable
        run: sudo chown -R "$USER" appliance-rpi-out
      - name: Allow KVM if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm: the boot test will use software emulation (slower)."
          fi
      - name: Boot test (QEMU virt twin of the same root file system)
        run: appliance/boot-test-rpi.sh "$PWD/appliance-rpi-out" "${{ steps.img.outputs.version }}" 1500
      - name: Boot test with a boot-partition password file (password sign-in)
        run: appliance/boot-test-rpi.sh "$PWD/appliance-rpi-out" "${{ steps.img.outputs.version }}" 1500 --config-disk boot --image "$IMAGE:${{ steps.img.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appliance-rpi-check
          path: appliance-rpi-out/*.img.xz
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
