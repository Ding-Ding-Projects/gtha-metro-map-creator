# Sign-in is on: every request except /healthz and the sign-in routes needs a valid session cookie.
absolute_redirect off;
auth_request /_auth/check;
error_page 401 = @gmmc_signin;

location @gmmc_signin { return 302 /signin?next=$gmmc_next; }
location @gmmc_rate { return 303 /signin?error=rate; }

location = /_auth/check {
  internal;
  proxy_pass http://127.0.0.1:9100/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# The sign-in page and its two assets.
location ^~ /signin {
  auth_request off;
  proxy_pass http://127.0.0.1:9100;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

# The sign-in form post is rate limited.
location = /signin/login {
  auth_request off;
  limit_req zone=gmmc_login burst=5 nodelay;
  limit_req_status 429;
  error_page 429 = @gmmc_rate;
  client_max_body_size 4k;
  proxy_pass http://127.0.0.1:9100;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location = /signout {
  auth_request off;
  proxy_pass http://127.0.0.1:9100;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
