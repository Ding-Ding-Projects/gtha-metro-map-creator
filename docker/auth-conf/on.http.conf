# Sign-in is on. Failed and repeated attempts at the sign-in form are limited to 6 a minute per address.
limit_req_zone $binary_remote_addr zone=gmmc_login:10m rate=6r/m;
# Only plain path characters are carried through to the sign-in page as the page to return to.
map $uri $gmmc_next {
  default "/";
  "~^(?<gmmc_p>/[A-Za-z0-9._~/-]*)$" $gmmc_p;
}
# Protected files must not be kept by shared caches.
map $uri $gmmc_cache { default "private, max-age=3600"; }
