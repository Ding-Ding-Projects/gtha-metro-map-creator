# The sign-in files are chosen at start-up by the entrypoint (see docker/entrypoint-auth.sh).
include /tmp/gmmc-auth/http.conf;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  include /tmp/gmmc-auth/server.conf;
  location = /healthz { auth_request off; access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { try_files $uri $uri/ =404; }
  location ~* \.(js|css|svg|png)$ { add_header Cache-Control $gmmc_cache; add_header X-Content-Type-Options nosniff always; }
}
