<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTHA Metro Map Creator</title>
<meta name="description" content="Browser editor for schematic metro maps of the Greater Toronto and Hamilton Area.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#map">Skip to map</a>
<header class="topbar">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 14h16M14 6v16" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>
    <span data-t="appName">GTHA Metro Map Creator</span>
  </div>
  <label class="title-field"><span class="vh" data-t="title">Map title</span>
    <input id="mapTitle" type="text" maxlength="120">
  </label>
  <nav class="tools" aria-label="Tools" id="tools"></nav>
  <div class="spacer"></div>
  <div class="actions">
    <button type="button" id="undoBtn" data-t="undo">Undo</button>
    <button type="button" id="redoBtn" data-t="redo">Redo</button>
    <button type="button" id="fitBtn" data-t="fit">Fit map</button>
    <div class="menu-wrap">
      <button type="button" id="exportBtn" class="primary" aria-haspopup="menu" aria-expanded="false" data-t="export">Export</button>
      <div class="menu" id="exportMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="svg" data-t="exportSvg">Download SVG</button>
        <button type="button" role="menuitem" data-act="png" data-t="exportPng">Download PNG</button>
        <button type="button" role="menuitem" data-act="json" data-t="exportJson">Download JSON</button>
        <button type="button" role="menuitem" data-act="open" data-t="importJson">Open JSON file</button>
        <button type="button" role="menuitem" data-act="template" data-t="template">GTHA template</button>
        <button type="button" role="menuitem" data-act="blank" data-t="blankMap">Blank map</button>
      </div>
    </div>
    <button type="button" id="settingsBtn" data-t="settings">Settings</button>
  </div>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>
</header>
<div class="workspace">
  <aside class="panel left" aria-label="Lines and search">
    <section>
      <h2 data-t="search">Find station</h2>
      <div class="search-row">
        <label class="vh" for="searchInput" data-t="search">Find station</label>
        <input id="searchInput" type="search" autocomplete="off">
      </div>
      <div class="regex-row">
        <label><span data-t="mode">Mode</span>
          <select id="searchMode"><option value="plain" data-t="plain">Plain text</option><option value="regex" data-t="regex">Regular expression</option></select>
        </label>
        <label class="check"><input type="checkbox" id="searchCase" checked> <span data-t="ignoreCase">Ignore case</span></label>
      </div>
      <p class="hint" id="searchStatus" role="status" aria-live="polite"></p>
      <ul class="results" id="searchResults"></ul>
    </section>
    <section>
      <div class="section-head"><h2 data-t="lines">Lines</h2><button type="button" id="newLineBtn" data-t="newLine">New line</button></div>
      <ul class="line-list" id="lineList"></ul>
    </section>
    <section>
      <h2 data-t="mapCheck">Map check</h2>
      <ul class="issues" id="issueList"></ul>
    </section>
  </aside>
  <main class="stage" id="stage">
    <svg id="map" tabindex="0" role="application" aria-label="Map canvas" aria-roledescription="map editor">
      <defs>
        <pattern id="gridPat" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.2" class="griddot"/></pattern>
      </defs>
      <g id="viewport"></g>
    </svg>
    <p class="status" id="statusBar" aria-live="polite"></p>
    <div class="drop" id="dropOverlay" hidden><p data-t="dropHere">Drop a map JSON file to open it</p></div>
  </main>
  <aside class="panel right" aria-label="Inspector">
    <h2 data-t="inspector">Inspector</h2>
    <div id="inspector"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <form method="dialog" class="dialog-body">
    <h2 id="settingsTitle" data-t="settings">Settings</h2>
    <label><span data-t="language">Language</span>
      <select id="setLang"><option value="en" data-t="lang_en">English</option><option value="yue" data-t="lang_yue">Cantonese</option><option value="both" data-t="lang_both">Bilingual</option></select></label>
    <label><span data-t="theme">Theme</span>
      <select id="setTheme"><option value="system" data-t="system">Match system</option><option value="light" data-t="light">Light</option><option value="dark" data-t="dark">Dark</option></select></label>
    <label><span data-t="fontSize">Label size</span> <input id="setFont" type="range" min="9" max="22" step="1"></label>
    <label class="check"><input id="setGrid" type="checkbox"> <span data-t="grid">Show grid</span></label>
    <label class="check"><input id="setSnap" type="checkbox"> <span data-t="snap">Snap to grid</span></label>
    <label class="check"><input id="setLegend" type="checkbox"> <span data-t="legend">Show legend in exports</span></label>
    <label class="check"><input id="setSound" type="checkbox"> <span data-t="sound">Sound effects</span></label>
    <div class="row">
      <button type="button" id="tidyBtn" data-t="tidyLabels">Reset all labels to automatic</button>
      <button type="button" id="setupBtn" data-t="runSetup">Run setup again</button>
      <button type="button" id="resetSettingsBtn" data-t="resetSettings">Reset settings</button>
    </div>
    <h3 data-t="shortcuts">Keyboard shortcuts</h3>
    <p class="hint">V S L T E · Delete · Ctrl+Z / Ctrl+Y · Arrows · F · Esc</p>
    <div class="row end"><button value="close" class="primary" data-t="close">Close</button></div>
  </form>
</dialog>

<dialog id="setupDialog" aria-labelledby="setupTitle">
  <div class="dialog-body">
    <p class="hint" id="setupProgress"></p>
    <h2 id="setupTitle" data-t="setupTitle">Set up your map</h2>
    <div id="setupStep"></div>
    <div class="row end">
      <button type="button" id="setupSkip" data-t="skip">Skip</button>
      <button type="button" id="setupBack" data-t="back">Back</button>
      <button type="button" id="setupNext" class="primary" data-t="next">Next</button>
    </div>
  </div>
</dialog>

<script src="i18n.js"></script>
<script src="gtha-template.js"></script>
<script src="app.js"></script>
</body>
</html>
