<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTHA Metro Map Creator Server Setup</title>
<link rel="stylesheet" href="wizard.css">
</head>
<body>
<div class="wiz">
  <nav class="rail" aria-label="Steps"><ol id="steps"></ol>
    <div class="rail-foot"><label><span data-t="language">Language</span>
      <select id="lang"><option value="en">English</option><option value="yue">廣東話</option><option value="both">English · 廣東話</option></select></label>
      <p class="ver" id="ver"></p></div>
  </nav>
  <main class="body">
    <h1 id="title" tabindex="-1"></h1>
    <p class="lead" id="lead"></p>
    <div id="pane"></div>
    <pre class="log" id="log" aria-label="Output" aria-live="polite" hidden></pre>
    <footer class="foot">
      <span id="stepOf"></span><span class="grow"></span>
      <button type="button" id="cancel" data-t="cancel">Cancel</button>
      <button type="button" id="back" data-t="back">Back</button>
      <button type="button" id="next" class="primary" data-t="next">Next</button>
    </footer>
  </main>
</div>
<script src="i18n.js"></script>
<script src="wizard.js"></script>
</body>
</html>
