<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTHA Metro Map Creator desktop app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dk button{font:inherit}
</style>
</helmet>
<div class="dk" style="font-family: Inter, 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: #16181D; background: #E9E7E1; width: 1280px; height: 800px; display: flex; flex-direction: column">
<div style="height: 36px; display: flex; align-items: center; background: #FFFFFF; border-bottom: 1px solid #DDDAD2">
<div style="padding: 0 12px; font-weight: 600">GTHA Metro Map Creator</div>
<div style="color: #6B6960">union-loop.json</div>
<div style="flex: 1 1 auto"></div>
<div style="display: flex; height: 100%">
<span style="width: 46px; display: flex; align-items: center; justify-content: center; color: #3B3A35">&#8212;</span>
<span style="width: 46px; display: flex; align-items: center; justify-content: center; color: #3B3A35">&#9633;</span>
<span style="width: 46px; display: flex; align-items: center; justify-content: center; color: #3B3A35">&#10005;</span>
</div>
</div>
<div style="height: 34px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: #FFFFFF; border-bottom: 1px solid #DDDAD2">
<sc-for list="{{menus}}" as="m" hint-placeholder-count="5">
<span style="padding: 6px 10px; border-radius: 6px">{{m}}</span>
</sc-for>
<div style="flex: 1 1 auto"></div>
<span style="padding: 4px 10px; border-radius: 999px; background: #E6F1EA; color: #0B6E4F; font-weight: 600">Works offline</span>
</div>
<div style="flex: 1 1 auto; display: flex; min-height: 0">
<aside style="width: 260px; background: #FFFFFF; border-right: 1px solid #DDDAD2; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6B6960; padding: 0 4px">Recent maps</div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
<div style="padding: 10px 12px; border-radius: 8px; background: {{r.bg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 600">{{r.name}}</span>
<span style="color: #6B6960; font-size: 12px">{{r.meta}}</span>
</div>
</sc-for>
<div style="flex: 1 1 auto"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="min-height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-weight: 600">New map from template</span>
<span style="min-height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #8E8B80; font-weight: 600">Open map file</span>
</div>
</aside>
<main style="flex: 1 1 auto; position: relative; background: #FBFAF7; overflow: hidden">
<svg viewBox="0 0 1020 690" width="1020" height="690" role="img" aria-label="Map canvas with four lines" style="display: block">
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D6CC"></circle></pattern></defs>
<rect width="1020" height="690" fill="url(#g)"></rect>
<path d="M60 430 L960 430" stroke="#3E8EDE" stroke-width="10" fill="none" stroke-linecap="round"></path>
<path d="M500 80 L500 330 L548 378 L548 430 L452 430 L452 378 L470 360" stroke="#F8C300" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M120 610 L330 610 L420 520 L960 520" stroke="#2E8B57" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M760 150 L760 430 L860 530 L860 640" stroke="#8B4AA0" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10"></path>
<g fill="#FFFFFF" stroke="#16181D" stroke-width="3">
<circle cx="500" cy="430" r="11"></circle><circle cx="760" cy="430" r="11"></circle><circle cx="420" cy="520" r="8"></circle><circle cx="500" cy="200" r="8"></circle><circle cx="240" cy="430" r="8"></circle><circle cx="860" cy="600" r="8"></circle>
</g>
<g font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#16181D" font-weight="600">
<text x="514" y="458">Union</text><text x="774" y="418">Bloor-Yonge</text><text x="432" y="548">Exhibition</text><text x="516" y="205">St Clair</text>
</g>
</svg>
<div style="position: absolute; right: 24px; top: 24px; width: 300px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 12px 32px rgba(22,24,29,.16); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="font-weight: 700; font-size: 15px">Save map as</div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="color: #6B6960; font-size: 12px">File name</span><span style="min-height: 34px; display: flex; align-items: center; padding: 0 10px; border: 2px solid {{accent}}; border-radius: 8px">union-loop.json</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="color: #6B6960; font-size: 12px">Format</span><span style="min-height: 34px; display: flex; align-items: center; padding: 0 10px; border: 1px solid #8E8B80; border-radius: 8px">Map file (JSON)</span></div>
<div style="display: flex; gap: 8px; justify-content: flex-end">
<span style="min-height: 34px; display: flex; align-items: center; padding: 0 14px; border-radius: 8px; border: 1px solid #8E8B80; font-weight: 600">Cancel</span>
<span style="min-height: 34px; display: flex; align-items: center; padding: 0 14px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-weight: 600">Save</span>
</div>
</div>
</main>
</div>
<div style="height: 28px; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #FFFFFF; border-top: 1px solid #DDDAD2; color: #6B6960; font-size: 12px">
<span>171 stations, 16 lines</span><span>Saved 2 minutes ago</span><div style="flex: 1 1 auto"></div><span>Version 1.1.0</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F5FBF","options":["#1F5FBF","#0B6E4F","#16181D"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1F5FBF',
      menus: ['File', 'Edit', 'View', 'Guides', 'Help'],
      recent: [
        { name: 'union-loop.json', meta: 'Edited today', bg: '#EEF3FB' },
        { name: 'hamilton-lrt.json', meta: 'Edited yesterday', bg: 'transparent' },
        { name: 'gtha-2031.json', meta: 'Edited last week', bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
